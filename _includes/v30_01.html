<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13231c">
<title>2026 東北9日｜V30</title>
<style>
:root{--bg:#f4f5f2;--card:#fff;--ink:#17211c;--muted:#68736d;--green:#1f5f46;--green2:#e5f0e9;--gold:#9c6a16;--gold2:#f7edd8;--red:#9e3434;--red2:#f9e8e8;--blue:#32627e;--blue2:#e8f0f5;--line:#dfe4e0;--shadow:0 8px 24px rgba(25,44,34,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;padding-bottom:92px}
a{color:inherit}.app{max-width:780px;margin:0 auto}
.hero{background:linear-gradient(145deg,#10251d,#275f49);color:#fff;padding:calc(24px + env(safe-area-inset-top)) 20px 24px;border-radius:0 0 28px 28px}
.eyebrow{font-size:12px;letter-spacing:.12em;opacity:.72;text-transform:uppercase}.hero h1{font-size:30px;line-height:1.15;margin:8px 0}.hero p{margin:0;opacity:.82;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}.stat{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:12px}.stat b{display:block;font-size:18px}.stat span{font-size:11px;opacity:.72}
.date-strip{position:sticky;top:0;z-index:20;display:flex;gap:8px;overflow:auto;background:rgba(244,245,242,.92);backdrop-filter:blur(16px);padding:10px 14px;border-bottom:1px solid var(--line);scrollbar-width:none}.date-strip::-webkit-scrollbar{display:none}
.date-pill{flex:none;text-decoration:none;background:#fff;border:1px solid var(--line);padding:8px 12px;border-radius:999px;font-size:13px;font-weight:700}
.section{padding:18px 14px}.section-title{display:flex;align-items:end;justify-content:space-between;margin:0 2px 12px}.section-title h2{margin:0;font-size:22px}.section-title span{font-size:12px;color:var(--muted)}
.day-card,.info-card,.todo-card,.oirase-card{background:var(--card);border:1px solid #e6e9e7;border-radius:20px;box-shadow:var(--shadow)}.day-card{margin:0 0 14px;overflow:hidden}
.day-head{display:flex;justify-content:space-between;gap:12px;padding:18px 18px 10px}.day-index{font-size:11px;color:var(--green);font-weight:800;letter-spacing:.08em}.day-head h2{font-size:20px;margin:3px 0}.day-head p{font-size:13px;color:var(--muted);margin:0}
.map-btn{align-self:flex-start;text-decoration:none;background:var(--green2);color:var(--green);padding:8px 12px;border-radius:999px;font-size:12px;font-weight:800}.hotel-line{padding:0 18px 14px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line)}
.timeline{padding:10px 14px 8px}.timeline-item{display:grid;grid-template-columns:72px 12px 1fr;gap:8px;min-height:76px}.time{font-size:12px;font-weight:750;padding-top:8px;color:#3f4b45}.dot{position:relative}.dot:before{content:"";position:absolute;top:14px;left:3px;width:7px;height:7px;border-radius:50%;background:var(--green)}.dot:after{content:"";position:absolute;top:24px;bottom:-9px;left:6px;width:1px;background:var(--line)}.timeline-item:last-child .dot:after{display:none}
.item-body{padding:7px 0 16px}.item-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.item-top h4{font-size:15px;line-height:1.35;margin:0;flex:1}.item-body p{font-size:12.5px;line-height:1.6;color:var(--muted);margin:6px 0 0}
.chip{flex:none;font-size:10px;font-weight:800;border-radius:999px;padding:4px 7px;background:#edf0ee;color:#53615a}.chip.danger{background:var(--red2);color:var(--red)}.chip.warn{background:var(--gold2);color:var(--gold)}.chip.poi{background:var(--green2);color:var(--green)}.chip.hotel{background:#eee9f7;color:#62468d}.chip.transport{background:var(--blue2);color:var(--blue)}.chip.food{background:#f5ede7;color:#8b5c38}.chip.stay{background:#e9eef8;color:#465f93}.chip.flex{background:#f0f0ef;color:#676a68}.chip.special{background:#f8e9d3;color:#985a16}
.grid{display:grid;gap:12px}.info-card,.todo-card,.oirase-card{padding:16px}.info-title{font-weight:800;font-size:15px;margin-bottom:10px}.kv{display:flex;justify-content:space-between;border-top:1px solid #eef0ee;padding:8px 0;font-size:13px}.kv span{color:var(--muted)}.info-card p,.todo-card p,.oirase-card p{font-size:12.5px;line-height:1.6;color:var(--muted);margin:8px 0 0}
.todo-top{display:flex;justify-content:space-between;gap:10px;margin-bottom:9px}.priority{font-size:10px;font-weight:900;background:var(--red2);color:var(--red);border-radius:999px;padding:4px 8px}.due{font-size:11px;color:var(--muted)}.todo-card h3,.oirase-card h3{font-size:15px;margin:0}.oirase-grid{display:grid;gap:12px}.oirase-card{border-left:5px solid var(--green)}.oirase-date{font-size:11px;font-weight:900;color:var(--green)}
.callout{background:#172b22;color:#fff;border-radius:20px;padding:18px;margin-bottom:14px}.callout h3{margin:0 0 7px;font-size:17px}.callout p{font-size:12.5px;line-height:1.6;margin:0;opacity:.8}
.bottom-nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:40;width:min(780px,100%);padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.bottom-nav button{border:0;background:transparent;padding:9px 4px;border-radius:12px;font-size:11px;font-weight:800;color:#66726c}.bottom-nav button.active{background:var(--green2);color:var(--green)}
.view{display:none}.view.active{display:block}.source{font-size:11px;color:#7c8580;padding:6px 18px 20px;text-align:center}
@media(min-width:650px){.section{padding:22px}.grid.two{grid-template-columns:1fr 1fr}.hero{padding-left:28px;padding-right:28px}}
</style>

<style>
