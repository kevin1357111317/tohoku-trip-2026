<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2026 東北9日｜V30</title>
</head>
<body>
<script>
(async()=>{
  const r = await fetch('https://raw.githubusercontent.com/kevin1357111317/tohoku-trip-2026/main/site1.txt');
  if (!r.ok) throw new Error('HTTP '+r.status);
  const b64 = (await r.text()).trim();
  const bin=atob(b64);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  const ds=new DecompressionStream('gzip');
  const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();
  document.open(); document.write(html); document.close();
})().catch(e=>{
  document.body.innerHTML='<pre style="white-space:pre-wrap;font-family:system-ui;padding:24px">網站載入失敗：'+e+'</pre>';
});
</script>
</body>
</html>
