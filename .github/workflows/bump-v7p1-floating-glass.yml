name: Bump public app to V7P1 floating glass nav

on:
  push:
    paths:
      - '.github/workflows/bump-v7p1-floating-glass.yml'

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update V7P1 and floating glass navigation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          held = []
          def hold(m):
              held.append(m.group(0))
              return f'__HELD_DATA_URI_{len(held)-1}__'
          work = re.sub(r'data:image/[^;]+;base64,[A-Za-z0-9+/=]+', hold, s)
          work = work.replace('V7P0', 'V7P1')
          marker = '/* V7P1_FLOATING_GLASS_NAV_START */'
          if marker not in work:
              css = '/* V7P1_FLOATING_GLASS_NAV_START */\nbody{padding-bottom:calc(118px + env(safe-area-inset-bottom))}\n.bottom-nav{left:50%;right:auto;bottom:calc(10px + env(safe-area-inset-bottom));width:min(calc(100% - 28px),892px);transform:translateX(-50%);grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;padding:7px;border:1px solid rgba(255,255,255,.28);border-radius:31px;background:linear-gradient(135deg,rgba(58,47,41,.80),rgba(84,66,56,.70));box-shadow:0 18px 44px rgba(45,33,27,.24),inset 0 1px 0 rgba(255,255,255,.18);backdrop-filter:blur(24px) saturate(1.35);-webkit-backdrop-filter:blur(24px) saturate(1.35);overflow:hidden}\n.bottom-nav:before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.10),transparent 42%)}\n.bottom-nav label{position:relative;z-index:1;min-width:0;padding:8px 2px 7px;border-radius:24px;color:rgba(255,248,239,.74);background:transparent;font-size:10.5px;transition:background .18s ease,color .18s ease,transform .18s ease,box-shadow .18s ease}\n.bottom-nav label svg{display:block;width:22px;height:22px;margin:0 auto 3px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}\n.bottom-nav .tab-text{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n#tab-lodging:checked~.bottom-nav label[for="tab-lodging"],#tab-transport:checked~.bottom-nav label[for="tab-transport"],#tab-trip:checked~.bottom-nav label[for="tab-trip"],#tab-budget:checked~.bottom-nav label[for="tab-budget"],#tab-todos:checked~.bottom-nav label[for="tab-todos"]{background:linear-gradient(135deg,rgba(255,248,238,.23),rgba(255,255,255,.10));color:#fff8ed;box-shadow:0 8px 18px rgba(20,14,11,.18),inset 0 1px 0 rgba(255,255,255,.16);backdrop-filter:blur(13px);-webkit-backdrop-filter:blur(13px);transform:translateY(-1px)}\n#tab-trip:checked~.bottom-nav label[for="tab-trip"]{color:#ffe3a6;background:linear-gradient(135deg,rgba(255,230,176,.24),rgba(255,255,255,.12))}\n#tab-lodging:checked~.bottom-nav label[for="tab-lodging"]:after,#tab-transport:checked~.bottom-nav label[for="tab-transport"]:after,#tab-trip:checked~.bottom-nav label[for="tab-trip"]:after,#tab-budget:checked~.bottom-nav label[for="tab-budget"]:after,#tab-todos:checked~.bottom-nav label[for="tab-todos"]:after{display:none!important}\n@media(max-width:420px){.bottom-nav{width:calc(100% - 20px);border-radius:29px;padding:6px}.bottom-nav label{padding:8px 1px 7px;font-size:10px;border-radius:22px}.bottom-nav label svg{width:21px;height:21px}}\n/* V7P1_FLOATING_GLASS_NAV_END */\n'
              work = work.replace('</style>', css + '</style>', 1)
          for i, data in enumerate(held):
              work = work.replace(f'__HELD_DATA_URI_{i}__', data)
          p.write_text(work, encoding='utf-8')
          sw = Path('service-worker.js')
          sws = sw.read_text(encoding='utf-8')
          sws = re.sub(r'const CACHE = "[^"]+";', 'const CACHE = "tohoku-v7p1-public-1";', sws, count=1)
          sw.write_text(sws, encoding='utf-8')
          PY
      - name: Commit public V7P1
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git diff --cached --quiet && exit 0
          git commit -m "V7P1 floating glass bottom navigation"
          git push
