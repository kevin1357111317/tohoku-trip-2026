name: Fix V7P4 IG-like glass nav

on:
  push:
    paths:
      - '.github/v7p4-ig-glass-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply IG-like glass nav
        run: python3 tools/fix_v7p4_ig_glass_nav.py
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Tune V7P4 nav to IG-like transparency"
          git push
