name: Fix V7P1 smoked glass navigation

on:
  push:
    paths:
      - '.github/workflows/fix-v7p1-smoked-glass.yml'

permissions:
  contents: write

jobs:
  fix-smoked-glass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch floating navigation and PWA cache
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = '/* V7P1_FLOATING_GLASS_NAV_START */'
          end = '/* V7P1_FLOATING_GLASS_NAV_END */'
          if start not in s or end not in s:
              raise SystemExit('V7P1 floating nav markers not found')
          block = '''/* V7P1_FLOATING_GLASS_NAV_START */
          body{padding-bottom:calc(118px + env(safe-area-inset-bottom))}
          .bottom-nav{position:fixed;left:50%;right:auto;bottom:calc(10px + env(safe-area-inset-bottom));z-index:50;width:min(calc(100% - 28px),892px);transform:translateX(-50%);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;padding:7px;border:1px solid rgba(255,255,255,.18);border-radius:31px;background-color:rgba(43,36,33,.90)!important;background-image:linear-gradient(135deg,rgba(50,41,37,.94),rgba(83,61,50,.84))!important;box-shadow:0 18px 44px rgba(45,33,27,.30),inset 0 1px 0 rgba(255,255,255,.12);backdrop-filter:blur(26px) saturate(1.20);-webkit-backdrop-filter:blur(26px) saturate(1.20);overflow:hidden;isolation:isolate}
          .bottom-nav:before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,0) 45%);z-index:0}
          .bottom-nav label{position:relative;z-index:1;min-width:0;padding:8px 2px 7px;border-radius:24px;color:rgba(255,248,239,.78)!important;background:transparent!important;font-size:10.5px;transition:background .18s ease,color .18s ease,transform .18s ease,box-shadow .18s ease}
          .bottom-nav label svg{display:block;width:22px;height:22px;margin:0 auto 3px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
          .bottom-nav .tab-text{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          #tab-lodging:checked~.bottom-nav label[for="tab-lodging"],#tab-transport:checked~.bottom-nav label[for="tab-transport"],#tab-trip:checked~.bottom-nav label[for="tab-trip"],#tab-budget:checked~.bottom-nav label[for="tab-budget"],#tab-todos:checked~.bottom-nav label[for="tab-todos"]{background:linear-gradient(135deg,rgba(247,222,201,.24),rgba(255,255,255,.08))!important;color:#fff7ed!important;box-shadow:0 8px 18px rgba(15,10,8,.24),inset 0 1px 0 rgba(255,255,255,.13);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transform:translateY(-1px)}
          #tab-trip:checked~.bottom-nav label[for="tab-trip"]{color:#ffe0a3!important;background:linear-gradient(135deg,rgba(183,122,75,.38),rgba(255,222,170,.12))!important}
          #tab-lodging:checked~.bottom-nav label[for="tab-lodging"]:after,#tab-transport:checked~.bottom-nav label[for="tab-transport"]:after,#tab-trip:checked~.bottom-nav label[for="tab-trip"]:after,#tab-budget:checked~.bottom-nav label[for="tab-budget"]:after,#tab-todos:checked~.bottom-nav label[for="tab-todos"]:after{display:none!important}
          @media(max-width:420px){.bottom-nav{width:calc(100% - 20px);border-radius:29px;padding:6px}.bottom-nav label{padding:8px 1px 7px;font-size:10px;border-radius:22px}.bottom-nav label svg{width:21px;height:21px}}
          /* V7P1_FLOATING_GLASS_NAV_END */'''
          a = s.index(start)
          b = s.index(end, a) + len(end)
          p.write_text(s[:a] + block + s[b:], encoding='utf-8')

          sw = Path('service-worker.js')
          t = sw.read_text(encoding='utf-8')
          if 'tohoku-v7p1-public-1' not in t:
              raise SystemExit('Expected V7P1 public-1 cache key not found')
          sw.write_text(t.replace('tohoku-v7p1-public-1','tohoku-v7p1-public-2'), encoding='utf-8')
          PY
      - name: Commit V7P1 glass hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix V7P1 smoked glass navigation"
          git push
