name: Sync V7P4 whole-dollar display

on:
  push:
    paths:
      - '.github/v7p4-trigger.txt'

permissions:
  contents: write

jobs:
  sync-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch App rounding
        run: python3 tools/sync_v7p4_rounding.py
      - name: Commit V7P4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git diff --cached --quiet && exit 0
          git commit -m "Publish V7P4 whole-dollar display"
          git push
