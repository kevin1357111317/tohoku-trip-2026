name: Sync V7P2 source

on:
  push:
    paths:
      - '.github/v7p2-trigger.txt'

permissions:
  contents: write

jobs:
  sync-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index source
        run: python3 tools/sync_v7p2_source.py
      - name: Commit index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Sync public index source to V7P2"
          git push
